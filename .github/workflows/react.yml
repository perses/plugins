name: react.yml
on:
  push:
    branches:
      - main
      - release/*
  pull_request:
  merge_group:

jobs:
  lint-npm:
    name: 'lint-npm'
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - uses: perses/github-actions@v0.13.0
      - uses: pnpm/setup@v2.1.0
        with:
          install: false
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check
  test-npm:
    name: 'test-npm'
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - uses: perses/github-actions@v0.13.0
      - uses: pnpm/setup@v2.1.0
        with:
          install: false
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test

  type-check:
    name: 'type-check'
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - uses: perses/github-actions@v0.13.0
      - uses: pnpm/setup@v2.1.0
        with:
          install: false
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm run type-check

  # Plugins are developed against React 18 (the minimum supported version); also validate them against React 19.
  react-19:
    name: 'type-check & test (React 19)'
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - uses: perses/github-actions@v0.13.0
      - uses: pnpm/setup@v2.1.0
        with:
          install: false
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm add --workspace-root --save-dev react@^19 react-dom@^19 @types/react@^19 @types/react-dom@^19
      # Fail fast if peer resolution silently kept React 18.
      - run: node -e "const v=require('react/package.json').version; if(!v.startsWith('19.')) { console.error('Expected React 19, got', v); process.exit(1) }"
      - run: pnpm run type-check
      - run: pnpm run test
